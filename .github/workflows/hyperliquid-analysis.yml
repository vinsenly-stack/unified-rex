name: Hyperliquid wallet analysis

on:
  push:
    branches: [tmp-hyperliquid-analysis]
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Hyperliquid analysis
        run: python tools/hyperliquid_analysis.py
      - uses: actions/upload-artifact@v4
        with:
          name: hyperliquid-analysis
          path: |
            hyperliquid_portfolio.json
            monthly_pnl_adjusted.csv
            summary.json
