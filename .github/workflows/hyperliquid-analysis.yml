name: Hyperliquid wallet analysis

on:
  push:
    branches: [tmp-hyperliquid-analysis]
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run cashflow-neutral analysis
        run: python tools/hyperliquid_twr.py
      - name: Run trade-level forensics
        run: python tools/hyperliquid_trade_forensics.py
      - name: Run entry-context analysis
        run: python tools/hyperliquid_entry_context.py
      - uses: actions/upload-artifact@v4
        with:
          name: hyperliquid-analysis
          path: |
            hyperliquid_portfolio.json
            monthly_twr.csv
            summary_twr.json
            trade_forensics_full.json
            episodes_full.csv
            entry_context.json
