name: Hyperliquid wallet analysis

on:
  push:
    branches: [tmp-hyperliquid-analysis]
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch and analyze Hyperliquid portfolio
        shell: python
        run: |
          import json, urllib.request, csv
          from datetime import datetime, timezone
          from collections import defaultdict

          address = "0x8bae3527e5a33fa0cf184f37bc112d071463ab6d"
          req = urllib.request.Request(
              "https://api.hyperliquid.xyz/info",
              data=json.dumps({"type":"portfolio","user":address}).encode(),
              headers={"Content-Type":"application/json"},
              method="POST",
          )
          with urllib.request.urlopen(req, timeout=30) as r:
              data = json.load(r)

          sections = {k:v for k,v in data}
          sec = sections.get("allTime") or sections.get("perpAllTime")
          if not sec:
              raise RuntimeError("No allTime/perpAllTime section")
          av = sorted((int(t), float(v)) for t,v in sec.get("accountValueHistory", []))
          pnl = sorted((int(t), float(v)) for t,v in sec.get("pnlHistory", []))
          if not av or not pnl:
              raise RuntimeError("Missing account value or pnl history")

          avmap = dict(av)
          # align by index/timestamp order as API histories are sampled together
          n=min(len(av),len(pnl))
          av=av[-n:]; pnl=pnl[-n:]
          series=[]
          for (ta,a),(tp,p) in zip(av,pnl):
              t=max(ta,tp)
              series.append((t,a,p))

          by_month=defaultdict(list)
          for row in series:
              dt=datetime.fromtimestamp(row[0]/1000,tz=timezone.utc)
              by_month[dt.strftime("%Y-%m")].append(row)

          rows=[]
          for m in sorted(by_month):
              arr=by_month[m]
              t0,a0,p0=arr[0]
              t1,a1,p1=arr[-1]
              month_pnl=p1-p0
              # Trading return using beginning account value as denominator.
              ret=month_pnl/a0*100 if a0 else float("nan")
              # Cash-flow-adjusted equity index: base + pnl change during month.
              eq=[a0 + (p-p0) for _,_,p in arr]
              peak=eq[0]; mdd=0.0
              for e in eq:
                  peak=max(peak,e)
                  mdd=min(mdd,(e/peak-1)*100)
              rows.append([m,a0,a1,month_pnl,ret,mdd])

          with open("monthly_pnl_adjusted.csv","w",newline="") as f:
              w=csv.writer(f)
              w.writerow(["month_utc","start_account_value","end_account_value","trading_pnl","trading_return_pct","cashflow_adjusted_max_dd_pct"])
              w.writerows(rows)

          # Overall cash-flow-adjusted cumulative equity based on first account value + cumulative pnl delta.
          base_a=series[0][1]; base_p=series[0][2]
          eq=[base_a+(p-base_p) for _,_,p in series]
          peak=eq[0]; overall_dd=0.0
          for e in eq:
              peak=max(peak,e)
              overall_dd=min(overall_dd,(e/peak-1)*100)
          total_pnl=series[-1][2]-base_p
          summary={
            "first_ts_utc":datetime.fromtimestamp(series[0][0]/1000,tz=timezone.utc).isoformat(),
            "last_ts_utc":datetime.fromtimestamp(series[-1][0]/1000,tz=timezone.utc).isoformat(),
            "start_account_value":base_a,
            "end_account_value":series[-1][1],
            "total_pnl_change":total_pnl,
            "pnl_return_on_initial_equity_pct":total_pnl/base_a*100,
            "cashflow_adjusted_sampled_max_dd_pct":overall_dd,
            "months":len(rows)
          }
          print("SUMMARY_JSON")
          print(json.dumps(summary))
          print("MONTHLY_CSV")
          print(open("monthly_pnl_adjusted.csv").read())
          with open("summary.json","w") as f: json.dump(summary,f,indent=2)
          with open("hyperliquid_portfolio.json","w") as f: json.dump(data,f,indent=2)

      - uses: actions/upload-artifact@v4
        with:
          name: hyperliquid-analysis
          path: |
            hyperliquid_portfolio.json
            monthly_pnl_adjusted.csv
            summary.json
