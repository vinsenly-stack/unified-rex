name: Fetch ZEC forward 1m

on:
  push:
    paths:
      - '.github/workflows/fetch-zec-forward.yml'
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Install Python deps
        run: python -m pip install --quiet pandas requests
      - name: Fetch Binance USD-M ZECUSDT 1m
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          python - <<'PY'
          import requests, pandas as pd, hashlib, json
          symbol='ZECUSDT'; interval='1m'
          start=pd.Timestamp('2026-09-20T00:00:00Z')
          end=pd.Timestamp('2026-09-25T00:00:00Z')
          rows=[]
          t=int(start.timestamp()*1000); end_ms=int(end.timestamp()*1000)
          while t < end_ms:
              r=requests.get('https://fapi.binance.com/fapi/v1/klines',
                  params={'symbol':symbol,'interval':interval,'startTime':t,'endTime':end_ms-1,'limit':1500},
                  timeout=30)
              r.raise_for_status()
              batch=r.json()
              if not batch: break
              rows.extend(batch)
              t=int(batch[-1][0])+60000
          cols=['open_time','open','high','low','close','volume','close_time','quote_volume','trades','taker_buy_volume','taker_buy_quote','ignore']
          df=pd.DataFrame(rows,columns=cols)
          df=df.drop_duplicates('open_time').sort_values('open_time')
          df=df[(df.open_time>=int(start.timestamp()*1000))&(df.open_time<end_ms)]
          df.to_csv('out/ZECUSDT_1m_2026-09-20_to_2026-09-24.csv',index=False)
          times=df.open_time.astype('int64').to_numpy()
          gaps=int(((times[1:]-times[:-1])!=60000).sum()) if len(times)>1 else 0
          sha=hashlib.sha256(open('out/ZECUSDT_1m_2026-09-20_to_2026-09-24.csv','rb').read()).hexdigest()
          meta={'rows':int(len(df)),'start':str(pd.to_datetime(df.open_time.iloc[0],unit='ms',utc=True)) if len(df) else None,
                'end':str(pd.to_datetime(df.open_time.iloc[-1],unit='ms',utc=True)) if len(df) else None,
                'gaps':gaps,'duplicates':int(df.open_time.duplicated().sum()),'sha256':sha}
          open('out/VALIDATION.json','w').write(json.dumps(meta,indent=2))
          print(json.dumps(meta,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: zec-forward-1m-20260920-24
          path: out/
          if-no-files-found: error
