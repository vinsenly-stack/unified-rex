name: Fetch ZEC forward 1m

on:
  push:
    paths:
      - '.github/workflows/fetch-zec-forward.yml'
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Binance Vision ZECUSDT 1m
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out raw
          for d in 2026-09-20 2026-09-21 2026-09-22 2026-09-23 2026-09-24; do
            url="https://data.binance.vision/data/futures/um/daily/klines/ZECUSDT/1m/ZECUSDT-1m-$d.zip"
            curl -fL --retry 3 "$url" -o "raw/$d.zip"
            unzip -q "raw/$d.zip" -d raw
          done
          python - <<'PY'
          import csv,glob,hashlib,json,datetime
          files=sorted(glob.glob('raw/ZECUSDT-1m-2026-09-*.csv'))
          header=['open_time','open','high','low','close','volume','close_time','quote_volume','trades','taker_buy_volume','taker_buy_quote','ignore']
          rows=[]
          for fn in files:
              with open(fn,newline='') as f:
                  r=csv.reader(f)
                  first=next(r)
                  if first and first[0].lower() in ('open_time','open time'):
                      pass
                  else:
                      rows.append(first)
                  rows.extend(r)
          rows.sort(key=lambda x:int(x[0]))
          dedup=[];seen=set()
          for row in rows:
              t=int(row[0])
              if t not in seen:
                  seen.add(t);dedup.append(row[:12])
          out='out/ZECUSDT_1m_2026-09-20_to_2026-09-24.csv'
          with open(out,'w',newline='') as f:
              w=csv.writer(f);w.writerow(header);w.writerows(dedup)
          times=[int(x[0]) for x in dedup]
          gaps=sum(1 for a,b in zip(times,times[1:]) if b-a!=60000)
          sha=hashlib.sha256(open(out,'rb').read()).hexdigest()
          fmt=lambda ms: datetime.datetime.fromtimestamp(ms/1000,datetime.timezone.utc).isoformat()
          meta={'rows':len(dedup),'start':fmt(times[0]) if times else None,'end':fmt(times[-1]) if times else None,
                'gaps':gaps,'duplicates':len(rows)-len(dedup),'sha256':sha,'source':'Binance Vision USD-M daily archives'}
          open('out/VALIDATION.json','w').write(json.dumps(meta,indent=2))
          print(json.dumps(meta,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: zec-forward-1m-20260920-24
          path: out/
          if-no-files-found: error
