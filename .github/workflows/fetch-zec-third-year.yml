name: Fetch ZEC third-year 1m

on:
  push:
    paths:
      - '.github/workflows/fetch-zec-third-year.yml'
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Binance Vision ZECUSDT third-year 1m
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p raw out
          for m in 2023-08 2023-09 2023-10 2023-11 2023-12 2024-01 2024-02 2024-03 2024-04 2024-05 2024-06 2024-07 2024-08; do
            url="https://data.binance.vision/data/futures/um/monthly/klines/ZECUSDT/1m/ZECUSDT-1m-$m.zip"
            curl -fL --retry 3 "$url" -o "raw/$m.zip"
            unzip -q "raw/$m.zip" -d raw
          done
          for d in $(seq -w 1 19); do
            day="2024-09-$d"
            url="https://data.binance.vision/data/futures/um/daily/klines/ZECUSDT/1m/ZECUSDT-1m-$day.zip"
            curl -fL --retry 3 "$url" -o "raw/$day.zip"
            unzip -q "raw/$day.zip" -d raw
          done
          python - <<'PY'
          import csv,glob,hashlib,json,datetime
          files=sorted(glob.glob('raw/ZECUSDT-1m-*.csv'));rows=[]
          for fn in files:
              with open(fn,newline='') as f:
                  r=csv.reader(f);first=next(r)
                  if first and first[0].lower() not in ('open_time','open time'):rows.append(first)
                  rows.extend(r)
          start=int(datetime.datetime(2023,8,20,tzinfo=datetime.timezone.utc).timestamp()*1000)
          end=int(datetime.datetime(2024,9,20,tzinfo=datetime.timezone.utc).timestamp()*1000)
          rows=[r[:12] for r in rows if start<=int(r[0])<end];rows.sort(key=lambda x:int(x[0]))
          dedup=[];seen=set()
          for row in rows:
              t=int(row[0])
              if t not in seen:seen.add(t);dedup.append(row)
          out='out/ZECUSDT_1m_2023-08-20_to_2024-09-19.csv';header=['open_time','open','high','low','close','volume','close_time','quote_volume','trades','taker_buy_volume','taker_buy_quote','ignore']
          with open(out,'w',newline='') as f:w=csv.writer(f);w.writerow(header);w.writerows(dedup)
          times=[int(x[0]) for x in dedup];gaps=sum(1 for a,b in zip(times,times[1:]) if b-a!=60000)
          sha=hashlib.sha256(open(out,'rb').read()).hexdigest();open('out/VALIDATION.json','w').write(json.dumps({'rows':len(dedup),'gaps':gaps,'duplicates':len(rows)-len(dedup),'sha256':sha},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: zec-third-year-1m-20230820-20240919
          path: out/
