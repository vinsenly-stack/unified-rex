name: temp-trava-sep30-data

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  download-binance-data:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Trava data downloader
        shell: cmd
        run: scripts\TRAVA_PRIVATE_UPDATE_2026-09-19_to_2026-09-30.bat

      - name: Upload Binance 1m update
        uses: actions/upload-artifact@v4
        with:
          name: TRAVA_PRIVATE_1M_UPDATE_2026-09-19_to_2026-09-30
          path: TRAVA_PRIVATE_1M_UPDATE_2026-09-19_to_2026-09-30.zip
          if-no-files-found: error
          retention-days: 1
